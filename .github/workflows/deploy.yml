name: Deploy to Liara

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: liara-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  LIARA_CLI_VERSION: 9.5.1

jobs:
  validate:
    name: validate-before-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: |
          pnpm format:check
          pnpm check
          pnpm test
          pnpm validate:topology
          pnpm build

  deploy-staging:
    name: deploy-${{ matrix.unit }}-staging
    if: (github.event_name == 'push' || inputs.environment == 'staging') && vars.LIARA_DEPLOY_ENABLED == 'true'
    needs: validate
    environment: staging
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: core
            app_secret: LIARA_CORE_APP
            dockerfile: deployment/Dockerfile.core
            port: '8080'
          - unit: worker
            app_secret: LIARA_WORKER_APP
            dockerfile: deployment/Dockerfile.worker
            port: '8090'
          - unit: app
            app_secret: LIARA_APP_WEB_APP
            dockerfile: deployment/Dockerfile.app
            port: '8080'
          - unit: studio
            app_secret: LIARA_STUDIO_WEB_APP
            dockerfile: deployment/Dockerfile.studio
            port: '8080'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy ${{ matrix.unit }} to Liara staging
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_APP_NAME: ${{ secrets[matrix.app_secret] }}
        run: |
          test -n "$LIARA_API_TOKEN"
          test -n "$LIARA_APP_NAME"
          npx --yes @liara/cli@${LIARA_CLI_VERSION} deploy \
            --api-token "$LIARA_API_TOKEN" \
            --app "$LIARA_APP_NAME" \
            --path . \
            --platform docker \
            --dockerfile "${{ matrix.dockerfile }}" \
            --port "${{ matrix.port }}" \
            --message "Casioplus ${GITHUB_SHA} staging ${{ matrix.unit }}" \
            --no-app-logs

  deploy-production:
    name: deploy-${{ matrix.unit }}-production
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && vars.LIARA_DEPLOY_ENABLED == 'true'
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: core
            app_secret: LIARA_CORE_APP
            dockerfile: deployment/Dockerfile.core
            port: '8080'
          - unit: worker
            app_secret: LIARA_WORKER_APP
            dockerfile: deployment/Dockerfile.worker
            port: '8090'
          - unit: app
            app_secret: LIARA_APP_WEB_APP
            dockerfile: deployment/Dockerfile.app
            port: '8080'
          - unit: studio
            app_secret: LIARA_STUDIO_WEB_APP
            dockerfile: deployment/Dockerfile.studio
            port: '8080'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy ${{ matrix.unit }} to Liara production
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_APP_NAME: ${{ secrets[matrix.app_secret] }}
        run: |
          test -n "$LIARA_API_TOKEN"
          test -n "$LIARA_APP_NAME"
          npx --yes @liara/cli@${LIARA_CLI_VERSION} deploy \
            --api-token "$LIARA_API_TOKEN" \
            --app "$LIARA_APP_NAME" \
            --path . \
            --platform docker \
            --dockerfile "${{ matrix.dockerfile }}" \
            --port "${{ matrix.port }}" \
            --message "Casioplus ${GITHUB_SHA} production ${{ matrix.unit }}" \
            --no-app-logs

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-and-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: casioplus
          POSTGRES_PASSWORD: casioplus
          POSTGRES_DB: casioplus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U casioplus -d casioplus_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm check

      - name: Unit and PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://casioplus:casioplus@127.0.0.1:5432/casioplus_ci
        run: pnpm test

      - name: Topology validation
        run: pnpm validate:topology

      - name: n8n workflow validation
        run: pnpm validate:n8n

      - name: Repository security validation
        run: pnpm validate:security

      - name: Production dependency audit
        run: pnpm security:audit

      - name: Migration smoke
        env:
          DATABASE_URL: postgresql://casioplus:casioplus@127.0.0.1:5432/casioplus_ci
        run: pnpm db:migrate

      - name: Build deployment units
        run: pnpm build

      - name: Validate n8n workflow import
        run: |
          docker run --rm \
            --volume "$PWD/runtime/n8n/workflows:/workflows:ro" \
            n8nio/n8n:2.36.8 \
            import:workflow --input=/workflows/casioplus-runtime-execution.json

      - name: Remix SSR smoke
        run: pnpm smoke:remix

      - name: Validate production images
        run: |
          docker build --file deployment/Dockerfile.core --tag casioplus-core-ci .
          docker build --file deployment/Dockerfile.worker --tag casioplus-worker-ci .
          docker build --file deployment/Dockerfile.dispatcher --tag casioplus-dispatcher-ci .
          docker build --file deployment/Dockerfile.n8n-adapter --tag casioplus-n8n-adapter-ci .
          docker build --file deployment/Dockerfile.console --tag casioplus-console-ci .
          docker build --file deployment/Dockerfile.forge --tag casioplus-forge-ci .

      - name: Create dependency inventory
        if: always()
        run: pnpm list --prod --json --depth Infinity > dependency-inventory.json

      - name: Upload dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casioplus-dependency-inventory
          path: dependency-inventory.json
          if-no-files-found: error
          retention-days: 30

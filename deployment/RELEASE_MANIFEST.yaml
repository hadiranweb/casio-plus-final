version: 1
product: casioplus
architecture: typescript-core-postgres-mvp
readiness: production-deployment-candidate-not-yet-deployed
exposure_model:
  direct_container_ports_public: false
  public_https_ingress:
    - console-web
    - forge-web
    - core-api-browser-endpoint
  internal_only:
    - native-diagnosis-worker
    - integration-dispatcher
    - n8n-adapter
    - open-webui-adapter
    - openclaw-adapter
    - n8n-runtime
    - open-webui-runtime
    - openclaw-runtime
units:
  core-api:
    path: services/core-api
    status: production-candidate
    public: false
    port: 8080
    health: /healthz
    canonical_store: postgres
  console-web:
    path: apps/console-web
    status: production-candidate
    public: false
    host: console.casioplus.com
    framework: remix
    compiler: remix-vite
    runtime: remix-serve
    build_output: build/server + build/client
    dockerfile: deployment/Dockerfile.console
    docker_build_validation: ci
  forge-web:
    path: apps/forge-web
    status: production-candidate
    public: false
    host: forge.casioplus.com
    framework: remix
    compiler: remix-vite
    runtime: remix-serve
    build_output: build/server + build/client
    dockerfile: deployment/Dockerfile.forge
    docker_build_validation: ci
  integration-dispatcher:
    path: services/integration-dispatcher
    status: production-candidate-outbox-dispatcher
    public: false
    trigger: core-internal-api
    canonical_store_access: false
    dockerfile: deployment/Dockerfile.dispatcher
    docker_build_validation: ci
  native-diagnosis-worker:
    path: services/native-diagnosis-worker
    status: production-candidate
    public: false
    trigger: core-signed-request
    canonical_store_access: false
    dockerfile: deployment/Dockerfile.worker
    docker_build_validation: ci
  n8n-adapter:
    path: services/n8n-adapter
    status: authenticated-runtime-boundary
    public: false
    port: 8082
    health: /healthz
    canonical_store_access: false
    dockerfile: deployment/Dockerfile.n8n-adapter
    docker_build_validation: ci
  n8n-runtime:
    path: runtime/n8n
    status: workflow-template-validated
    image: n8nio/n8n:2.36.8
    role: orchestrator-only
    public: false
    canonical_store_access: false
    persistence: runtime-internal-only
  open-webui-adapter:
    path: services/open-webui-adapter
    status: authenticated-model-only-boundary
    public: false
    port: 8083
    health: /healthz
    canonical_store_access: false
    dockerfile: deployment/Dockerfile.open-webui-adapter
    docker_build_validation: ci
  open-webui-runtime:
    path: runtime/open-webui
    status: pinned-private-runtime
    image: ghcr.io/open-webui/open-webui:v0.11.1
    role: interaction-model-plane-only
    public: false
    canonical_store_access: false
    persistence: runtime-internal-only
  openclaw-adapter:
    path: services/openclaw-adapter
    status: approval-gated-action-boundary
    public: false
    port: 8084
    health: /healthz
    canonical_store_access: false
    dockerfile: deployment/Dockerfile.openclaw-adapter
    docker_build_validation: ci
  openclaw-runtime:
    path: runtime/openclaw
    status: pinned-private-runtime
    image: ghcr.io/openclaw/openclaw:2026.7.1-2
    role: allowlisted-action-plane-only
    public: false
    canonical_store_access: false
    persistence: runtime-internal-only
resources:
  postgres:
    purpose: canonical
    direct_runtime_access: false
  redis:
    purpose: ephemeral-rate-limit-only
  postgres-outbox:
    purpose: canonical-integration-queue
  object_storage:
    purpose: artifact-by-reference
promotion:
  staging_required: true
  production_environment_protected: true
  required_evidence:
    - migration-on-empty-database
    - core-health
    - tenant-isolation
    - organization-workspace-member-invitation-control-plane
    - external-app-key-rotation-and-tenant-mapping
    - forge-run-lifecycle
    - approval-inbox-and-action-governance
    - runtime-metering-and-economics-control-plane
    - n8n-workflow-validation
    - n8n-adapter-authentication
    - open-webui-model-only-contract
    - openclaw-approval-and-target-resolution
    - runtime-usage-attribution
    - golden-flow-e2e
    - accessibility-six-state
    - performance-budgets
    - independent-design-audit
    - artifact-delivery
    - backup-restore-drill
    - rollback-pointer
    - user-production-approval
constraints:
  mysql_legacy_dual_write: false
  rust_critical_path: false
  direct_runtime_database_credentials: false

services:
  n8n-runtime-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${N8N_DB_USER:?required}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?required}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n_runtime}
    volumes:
      - n8n-runtime-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [n8n-runtime]

  n8n:
    image: n8nio/n8n:2.36.8
    restart: unless-stopped
    depends_on:
      n8n-runtime-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-runtime-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n_runtime}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:?required}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      N8N_HOST: ${N8N_HOST:?required}
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${N8N_PUBLIC_URL:?required}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-UTC}
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_DATA_MAX_AGE:-168}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      CASIOPLUS_GITHUB_APP_INTERNAL_URL: ${CASIOPLUS_GITHUB_APP_INTERNAL_URL:-http://github-app-adapter:8085}
      ADAPTER_SHARED_SECRET: ${ADAPTER_SHARED_SECRET:?required}
      CASIOPLUS_CORE_INTERNAL_URL: ${CASIOPLUS_CORE_INTERNAL_URL:-http://core-api:8080}
      TRANSLATION_SCHEDULER_SECRET: ${TRANSLATION_SCHEDULER_SECRET:?required}
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [n8n-runtime, casioplus-runtime]

  n8n-adapter:
    build:
      context: ../..
      dockerfile: deployment/Dockerfile.n8n-adapter
    restart: unless-stopped
    depends_on: [n8n]
    environment:
      PORT: 8082
      NODE_ENV: production
      ADAPTER_SHARED_SECRET: ${ADAPTER_SHARED_SECRET:?required}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/casioplus-runtime-execution
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:?required}
      N8N_WEBHOOK_TIMEOUT_MS: ${N8N_WEBHOOK_TIMEOUT_MS:-60000}
    networks: [n8n-runtime, casioplus-runtime]

networks:
  n8n-runtime:
    internal: true
  casioplus-runtime:
    external: true

volumes:
  n8n-runtime-db:
  n8n-data:
